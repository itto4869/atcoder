---
type: Batch
timelimit: 2s
match: Lines

cases:
  - name: sample1
    in: |
      4 10
      2 3 5 7
    out: |
      2
  - name: sample2
    in: |
      6 15
      1 2 4 5 8 10
    out: |
      4
  - name: sample3
    in: |
      10 1000000000000
      100000000000 200000000000 300000000000 400000000000 500000000000 600000000000 700000000000 800000000000 900000000000 1000000000000
    out: |
      10

extend:
  - type: Text
    path: "./e"
    in: /in/*.txt
    out: /out/*.txt
