---
type: Batch
timelimit: 2s
match: Lines

cases:
  - name: sample1
    in: |
      5 3
      1 4 3 2 3
    out: |
      3
  - name: sample2
    in: |
      7 100
      50 200 100 100 300 100 400
    out: |
      3
  - name: sample3
    in: |
      10 999999999
      1 1000000000 500000000 123456789 999999999 999999999 777777777 888888888 999999999 1
    out: |
      5

extend:
  - type: Text
    path: "./a"
    in: /in/*.txt
    out: /out/*.txt
