---
type: Batch
timelimit: 2s
match: Lines

cases:
  - name: sample1
    in: |
      5 3
      6 7 9 12 5
    out: |
      27
  - name: sample2
    in: |
      8 5
      10 25 7 15 30 8 100 3
    out: |
      180
  - name: sample3
    in: |
      10 1000000
      500000 1000000 2000000 3000000 750000 4000000 1234567 5000000 999999 6000000
    out: |
      21000000

extend:
  - type: Text
    path: "./a"
    in: /in/*.txt
    out: /out/*.txt
