---
type: Batch
timelimit: 2s
match: Lines

cases:
  - name: sample1
    in: |
      3 2
      1 5 3
    out: |
      2
  - name: sample2
    in: |
      5 3
      2 4 5 3 1
    out: |
      0
  - name: sample3
    in: |
      7 10
      5 30 15 50 20 100 85
    out: |
      235

extend:
  - type: Text
    path: "./c"
    in: /in/*.txt
    out: /out/*.txt
