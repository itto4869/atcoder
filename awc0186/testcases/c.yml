---
type: Batch
timelimit: 2s
match: Lines

cases:
  - name: sample1
    in: |
      5 3 2
      10101
    out: |
      1
  - name: sample2
    in: |
      4 2 1
      0000
    out: |
      3
  - name: sample3
    in: |
      12 5 3
      110010111000
    out: |
      3
  - name: sample4
    in: |
      24 7 4
      101101001110100110101011
    out: |
      3
  - name: sample5
    in: |
      1 1 0
      0
    out: |
      0

extend:
  - type: Text
    path: "./c"
    in: /in/*.txt
    out: /out/*.txt
