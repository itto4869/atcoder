    in: |
      5 3
      4 2 1 3 5
    out: |
      6
  - name: sample2
    in: |
      8 4
      10 5 8 3 2 7 4 6
    out: |
      16
  - name: sample3
    in: |
      10 5
      100 200 50 80 120 30 60 90 150 70
    out: |
      340

extend:
  - type: Text
    path: "./b"
    in: /in/*.txt
    out: /out/*.txt
