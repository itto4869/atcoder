---
type: Batch
timelimit: 2s
match: Lines

cases:
  - name: sample1
    in: |
      3 5 2
      @.F.G
      .....
      ..F..
    out: |
      8
  - name: sample2
    in: |
      3 5 1
      @.#F.
      ..#..
      ..#.G
    out: |
      -1
  - name: sample3
    in: |
      7 10 3
      @........F
      .########.
      .#......#.
      .#..F...#.
      .#......#.
      .########.
      G........F
    out: |
      -1

extend:
  - type: Text
    path: "./e"
    in: /in/*.txt
    out: /out/*.txt
