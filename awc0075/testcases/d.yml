---
type: Batch
timelimit: 2s
match: Lines

cases:
  - name: sample1
    in: |
      5 2 3
      1 3 5 8 10
    out: |
      4
  - name: sample2
    in: |
      4 2 2
      1 5 10 20
    out: |
      10
  - name: sample3
    in: |
      10 3 4
      2 5 8 11 15 20 25 30 33 37
    out: |
      10
  - name: sample4
    in: |
      20 5 5
      3 7 12 18 25 31 38 42 50 55 63 70 78 85 90 96 100 108 115 120
    out: |
      20
  - name: sample5
    in: |
      1 1 1
      1000000000
    out: |
      0

extend:
  - type: Text
    path: "./d"
    in: /in/*.txt
    out: /out/*.txt
