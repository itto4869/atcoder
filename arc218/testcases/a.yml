---
type: Batch
timelimit: 2s
match: Lines

cases:
  - name: sample1
    in: |
      2 2
      1 3
      2 3
    out: |
      7
  - name: sample2
    in: |
      2 2
      1 1
      1 2
    out: |
      6
  - name: sample3
    in: |
      3 5
      3 1 3 4 2
      5 2 1 2 3
      4 6 2 5 6
    out: |
      327

extend:
  - type: Text
    path: "./a"
    in: /in/*.txt
    out: /out/*.txt
