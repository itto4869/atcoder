---
type: Batch
timelimit: 2s
match: Lines

cases:
  - name: sample1
    in: |
      5
      3 1 4 1 5
    out: |
      9
  - name: sample2
    in: |
      3
      100 200 150
    out: |
      350
  - name: sample3
    in: |
      10
      500000000 1000000000 250000000 750000000 100000000 999999999 300000000 600000000 400000000 800000000
    out: |
      1999999999

extend:
  - type: Text
    path: "./c"
    in: /in/*.txt
    out: /out/*.txt
