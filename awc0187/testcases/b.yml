---
type: Batch
timelimit: 2s
match: Lines

cases:
  - name: sample1
    in: |
      8
      .##.###.
    out: |
      3
  - name: sample2
    in: |
      5
      .....
    out: |
      0
  - name: sample3
    in: |
      3
      #.#
    out: |
      1
  - name: sample4
    in: |
      45
      #.###.#.###.###.#.######.##..##.#..###..##.##
    out: |
      6
  - name: sample5
    in: |
      15
      .##..########.#
    out: |
      8

extend:
  - type: Text
    path: "./b"
    in: /in/*.txt
    out: /out/*.txt
