---
type: Batch
timelimit: 2s
match: Lines

cases:
  - name: sample1
    in: |
      5 2 10
      1 3 2 4 1
    out: |
      9
  - name: sample2
    in: |
      7 3 20
      -2 5 -1 4 3 -3 2
    out: |
      22
  - name: sample3
    in: |
      10 1000000000 5000000000
      100 -500 300 200 -100 400 -200 150 250 -50
    out: |
      35

extend:
  - type: Text
    path: "./e"
    in: /in/*.txt
    out: /out/*.txt
