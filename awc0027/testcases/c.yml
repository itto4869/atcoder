---
type: Batch
timelimit: 2s
match: Lines

cases:
  - name: sample1
    in: |
      3
      1 5 3
    out: |
      2
  - name: sample2
    in: |
      5
      10 25 15 40 30
    out: |
      10
  - name: sample3
    in: |
      8
      100 350 200 550 700 900 450 1000
    out: |
      200

extend:
  - type: Text
    path: "./c"
    in: /in/*.txt
    out: /out/*.txt
