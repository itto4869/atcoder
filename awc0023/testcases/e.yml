---
type: Batch
timelimit: 2s
match: Lines

cases:
  - name: sample1
    in: |
      3 10
      4 5 6
    out: |
      2
  - name: sample2
    in: |
      5 100
      30 50 40 20 60
    out: |
      2
  - name: sample3
    in: |
      8 1000
      200 300 150 400 250 100 350 450
    out: |
      3

extend:
  - type: Text
    path: "./e"
    in: /in/*.txt
    out: /out/*.txt
