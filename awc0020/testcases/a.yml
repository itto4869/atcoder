---
type: Batch
timelimit: 2s
match: Lines

cases:
  - name: sample1
    in: |
      3
      1 2 3
    out: |
      Yes
  - name: sample2
    in: |
      4
      1 2 3 5
    out: |
      No
  - name: sample3
    in: |
      6
      0 1000000000 500000000 200000000 100000000 200000000
    out: |
      No

extend:
  - type: Text
    path: "./a"
    in: /in/*.txt
    out: /out/*.txt
