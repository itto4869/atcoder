---
type: Batch
timelimit: 2s
match: Lines

cases:
  - name: sample1
    in: |
      4
      3 1 4 2
    out: |
      3
  - name: sample2
    in: |
      7
      10 50 30 20 40 5 25
    out: |
      45
  - name: sample3
    in: |
      10
      1000000000 1 500000000 250000000 750000000 100 999999999 2 123456789 987654321
    out: |
      999999999

extend:
  - type: Text
    path: "./c"
    in: /in/*.txt
    out: /out/*.txt
