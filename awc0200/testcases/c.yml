---
type: Batch
timelimit: 2s
match: Lines

cases:
  - name: sample1
    in: |
      3 3
      v>v
      vv>
      >>>
    out: |
      3 3
  - name: sample2
    in: |
      3 4
      >>>v
      vv>v
      >v>>
    out: |
      3 4
  - name: sample3
    in: |
      5 6
      v>>v>>
      >v>>v>
      v>v>>v
      >>vv>>
      vv>>v>
    out: |
      5 5
  - name: sample4
    in: |
      8 10
      >>v>>>v>>>
      v>v>>v>v>>
      >>v>v>>>v>
      v>>>v>v>>v
      >v>>v>>>v>
      v>v>>>v>>v
      >>v>v>>v>>
      v>>>v>>>>>
    out: |
      8 10
  - name: sample5
    in: |
      1 1
      v
    out: |
      1 1

extend:
  - type: Text
    path: "./c"
    in: /in/*.txt
    out: /out/*.txt
