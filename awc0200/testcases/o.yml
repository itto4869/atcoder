---
type: Batch
timelimit: 2s
match: Lines

cases:
  - name: sample1
    in: |
      2 1
      2 3
    out: |
      3
  - name: sample2
    in: |
      1 1
      1
    out: |
      -1
  - name: sample3
    in: |
      6 3
      4 8 2 10 5 7
    out: |
      7
  - name: sample4
    in: |
      12 5
      15 3 22 8 19 6 11 30 4 17 25 9
    out: |
      17
  - name: sample5
    in: |
      1 10000
      1000000000
    out: |
      -1

extend:
  - type: Text
    path: "./o"
    in: /in/*.txt
    out: /out/*.txt
