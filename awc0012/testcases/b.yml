---
type: Batch
timelimit: 2s
match: Lines

cases:
  - name: sample1
    in: |
      5 30 10 25
      15 30 25 40 35
    out: |
      30
  - name: sample2
    in: |
      7 50 100 40
      60 30 55 45 80 50 10
    out: |
      160
  - name: sample3
    in: |
      10 1000000000 500000000 300000000
      999999999 1000000000 500000000 1000000000 999999998 1000000000 200000000 1000000000 999999999 1000000000
    out: |
      1500000000

extend:
  - type: Text
    path: "./b"
    in: /in/*.txt
    out: /out/*.txt
