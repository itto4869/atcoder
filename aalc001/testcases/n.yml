---
type: Batch
timelimit: 2s
match: Lines

cases:
  - name: sample1
    in: |
      3 1
      2 2 3 3
    out: |
      11
  - name: sample2
    in: |
      3 2
      1 2 2 3
      2 1 3 2
    out: |
      10
  - name: sample3
    in: |
      4 3
      1 1 2 4
      3 1 4 2
      3 3 4 4
    out: |
      0

extend:
  - type: Text
    path: "./n"
    in: /in/*.txt
    out: /out/*.txt
