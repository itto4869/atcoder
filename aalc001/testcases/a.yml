    in: |
      5 5
      5 3 7 9 1
      2 2 4
      1 3 2
      2 2 4
      1 5 8
      2 4 5
    out: |
      3
      2
      8
  - name: sample2
    in: |
      3 4
      0 1000000000 7
      2 1 1
      2 2 2
      1 1 1000000000
      2 1 3
    out: |
      0
      1000000000
      7

extend:
  - type: Text
    path: "./a"
    in: /in/*.txt
    out: /out/*.txt
