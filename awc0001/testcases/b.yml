---
type: Batch
timelimit: 2s
match: Lines

cases:
  - name: sample1
    in: |
      5 60 80
      55 72 80 90 65
    out: |
      3
  - name: sample2
    in: |
      8 50 70
      45 70 60 70 80 55 30 68
    out: |
      2
  - name: sample3
    in: |
      10 40 60
      35 100 25 55 60 60 75 42 38 90
    out: |
      5

extend:
  - type: Text
    path: "./b"
    in: /in/*.txt
    out: /out/*.txt
