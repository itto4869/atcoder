---
type: Batch
timelimit: 2s
match: Lines

cases:
  - name: sample1
    in: |
      5 3 20
      2 3 5 8 1
    out: |
      Yes
  - name: sample2
    in: |
      3 1 100
      5 10 20
    out: |
      No
  - name: sample3
    in: |
      10 5 50
      3 7 2 8 4 15 6 1 12 9
    out: |
      Yes
  - name: sample4
    in: |
      15 10 1000000000000000000
      999999999 1000000000 500000000 800000000 200000000 100000000 50000000 10 5 3 2 1 7 8 4
    out: |
      No
  - name: sample5
    in: |
      1 1 1
      1
    out: |
      Yes

extend:
  - type: Text
    path: "./b"
    in: /in/*.txt
    out: /out/*.txt
