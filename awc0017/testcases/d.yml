    in: |
      4 2 2
      10 8 6 5
      1 2 3
      3 4 2
    out: |
      16
  - name: sample2
    in: |
      5 4 3
      100 90 80 70 60
      1 2 50
      1 3 40
      2 3 30
      4 5 10
    out: |
      220
  - name: sample3
    in: |
      8 6 4
      1000000000 900000000 800000000 700000000 600000000 500000000 400000000 300000000
      1 2 500000000
      1 3 400000000
      2 3 300000000
      1 4 200000000
      5 6 100000000
      7 8 50000000
    out: |
      2700000000

extend:
  - type: Text
    path: "./d"
    in: /in/*.txt
    out: /out/*.txt
