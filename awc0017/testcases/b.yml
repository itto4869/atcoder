    in: |
      5 3
      1 2 3 4 5
      2 4 4
    out: |
      2 3 6 6 7
  - name: sample2
    in: |
      7 5
      0 0 0 0 0 0 0
      1 3 5 7 4
    out: |
      1 2 2 3 2 2 1
  - name: sample3
    in: |
      10 8
      100 200 300 400 500 600 700 800 900 1000
      1 1 5 5 5 10 3 7
    out: |
      102 203 301 404 503 604 701 801 901 1001

extend:
  - type: Text
    path: "./b"
    in: /in/*.txt
    out: /out/*.txt
