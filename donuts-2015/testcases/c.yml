    in: |
      5
      2 5 3 4 1
    out: |
      0
      1
      1
      2
      2
  - name: sample2
    in: |
      1
      1000000
    out: |
      0
  - name: sample3
    in: |
      8
      66 52 56 32 27 50 72 23
    out: |
      0
      1
      2
      2
      3
      4
      3
      1

extend:
