[package]
name = "joisc2010"
version = "0.1.0"
edition = "2024"

[package.metadata.cargo-compete.bin]
joisc2010-aplusb = { alias = "aplusb", problem = "https://atcoder.jp/contests/joisc2010/tasks/joisc2010_aplusb" }
joisc2010-contest = { alias = "contest", problem = "https://atcoder.jp/contests/joisc2010/tasks/joisc2010_contest" }
