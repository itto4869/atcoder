---
type: Batch
timelimit: 2s
match: Lines

cases:
  - name: sample1
    in: |
      3 4
      2 3 2
      1 2 1 2
    out: |
      Yes
  - name: sample2
    in: |
      2 3
      2 2
      2 2 1
    out: |
      No
  - name: sample3
    in: |
      5 6
      4 3 5 2 4
      2 3 1 2 3 2
    out: |
      Yes

extend:
  - type: Text
    path: "./d"
    in: /in/*.txt
    out: /out/*.txt
