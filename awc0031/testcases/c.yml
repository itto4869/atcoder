---
type: Batch
timelimit: 2s
match: Lines

cases:
  - name: sample1
    in: |
      5 3 1 5
      0 0
      2 1
      -1 2
      3 -1
      4 3
    out: |
      2
  - name: sample2
    in: |
      4 2 1 4
      0 0
      1 1
      2 0
      100 100
    out: |
      -1
  - name: sample3
    in: |
      8 5 1 8
      0 0
      3 4
      -2 3
      1 -4
      7 7
      4 0
      0 5
      10 10
    out: |
      3

extend:
  - type: Text
    path: "./c"
    in: /in/*.txt
    out: /out/*.txt
