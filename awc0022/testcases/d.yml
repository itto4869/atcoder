---
type: Batch
timelimit: 2s
match: Lines

cases:
  - name: sample1
    in: |
      5 3
      0 1 1 1 0
    out: |
      1
  - name: sample2
    in: |
      4 2
      1 0 0 1
    out: |
      3
  - name: sample3
    in: |
      10 3
      1 1 1 0 0 0 1 1 1 0
    out: |
      2

extend:
  - type: Text
    path: "./d"
    in: /in/*.txt
    out: /out/*.txt
