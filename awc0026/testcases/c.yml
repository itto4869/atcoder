---
type: Batch
timelimit: 2s
match: Lines

cases:
  - name: sample1
    in: |
      5 2 20
      3 5 1 4 7
    out: |
      3
  - name: sample2
    in: |
      8 3 100
      10 20 5 15 8 30 12 25
    out: |
      3
  - name: sample3
    in: |
      10 10000 100000000000000
      1000000000 999999999 999999998 999999997 999999996 999999995 999999994 999999993 999999992 999999991
    out: |
      10

extend:
  - type: Text
    path: "./c"
    in: /in/*.txt
    out: /out/*.txt
