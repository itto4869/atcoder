---
type: Batch
timelimit: 2s
match: Lines

cases:
  - name: sample1
    in: |
      5 3
      1 4 2 5 3
    out: |
      6
  - name: sample2
    in: |
      7 0
      3 3 3 5 5 3 3
    out: |
      12
  - name: sample3
    in: |
      10 5
      2 -1 3 7 4 0 6 1 5 -2
    out: |
      2

extend:
  - type: Text
    path: "./e"
    in: /in/*.txt
    out: /out/*.txt
