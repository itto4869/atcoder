---
type: Batch
timelimit: 2s
match: Lines

cases:
  - name: sample1
    in: |
      7 3 4
      2 -1 5 3 -2 4 1
    out: |
      7
  - name: sample2
    in: |
      5 2 3
      -3 -5 -1 -4 -2
    out: |
      -5
  - name: sample3
    in: |
      15 5 8
      1 -3 4 -2 5 1 -6 3 7 -1 2 8 -4 3 -5
    out: |
      19
  - name: sample4
    in: |
      20 7 12
      3 -1 4 1 5 -9 2 6 -5 3 5 8 -3 7 2 -4 6 1 -2 3
    out: |
      21
  - name: sample5
    in: |
      1 1 1
      -1000000000
    out: |
      -1000000000

extend:
  - type: Text
    path: "./b"
    in: /in/*.txt
    out: /out/*.txt
