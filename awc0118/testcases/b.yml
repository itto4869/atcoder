---
type: Batch
timelimit: 2s
match: Lines

cases:
  - name: sample1
    in: |
      6 2
      1 3 5 2 8 7
    out: |
      3
  - name: sample2
    in: |
      10 3
      1 5 9 13 17 2 6 10 14 18
    out: |
      5
  - name: sample3
    in: |
      15 100
      50 200 350 500 120 80 210 340 510 130 75 220 360 490 140
    out: |
      6

extend:
  - type: Text
    path: "./b"
    in: /in/*.txt
    out: /out/*.txt
