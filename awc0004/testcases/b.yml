---
type: Batch
timelimit: 2s
match: Lines

cases:
  - name: sample1
    in: |
      3 5
      100 10
      30 8
      50 20
    out: |
      50
  - name: sample2
    in: |
      4 10
      200 15
      80 10
      150 30
      60 5
    out: |
      60
  - name: sample3
    in: |
      5 1000000000
      1000000000 1
      500000000 2
      100 1000000000
      999999999 1
      1 1
    out: |
      0

extend:
  - type: Text
    path: "./b"
    in: /in/*.txt
    out: /out/*.txt
